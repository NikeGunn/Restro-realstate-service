# Ingress Configuration for K3s/Traefik
# Routes external traffic to frontend and backend services
# Handles TLS termination with cert-manager
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chatplatform-ingress
  namespace: chatplatform
  labels:
    app.kubernetes.io/name: chatplatform
    app.kubernetes.io/component: ingress
  annotations:
    # Cert-manager for automatic TLS certificates
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

    # Traefik annotations (K3s default ingress)
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - kribaat.com
        - www.kribaat.com
      secretName: chatplatform-tls
    - hosts:
        - argocd.kribaat.com
      secretName: argocd-tls
    # Listing photos (realestate/media_proxy.py streams them from R2; kribaat.com's DNS zone is in
    # another Cloudflare account, so the bucket cannot bind this domain itself).
    - hosts:
        - media.kribaat.com
      secretName: media-tls
  rules:
    # Main domain
    - host: kribaat.com
      http:
        paths:
          # API routes → backend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          # Admin routes → backend
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          # Static files → backend
          - path: /static
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          # Media files (Content Studio images, brand-kit logos, QR/posters) → backend
          - path: /media
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          # Webhook routes → backend
          - path: /webhooks
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          # Widget routes → backend
          - path: /widget
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          # Public lucky-draw entry pages (server-rendered HTML, no auth) → backend
          - path: /public
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          # Public listings website (server-rendered for SEO) + sitemap/robots -> backend
          - path: /realestate/properties
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /sitemap.xml
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /robots.txt
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: 8000
          # Everything else → frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

    # WWW subdomain (same as main)
    - host: www.kribaat.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /static
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /media
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /webhooks
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /widget
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /public
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /realestate/properties
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /sitemap.xml
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /robots.txt
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

    # Listing photo CDN origin → backend (/listings/<org>/<listing>/<hex>.jpg only)
    - host: media.kribaat.com
      http:
        paths:
          - path: /listings
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000

# Note: HTTP to HTTPS redirect and middlewares removed
# Nginx handles SSL termination and redirects at the edge
